# ASH-FL: Federated Learning Simulation Configuration (IMPROVED)

# Federated Learning Parameters
num_rounds: 15                   # Total rounds (increased from 3 to 15 for better convergence)
num_clients_total: 5            # Total number of clients in the federation
num_clients_per_round: 4        # Increased from 3 to 4 for more participation

# Model Training Parameters (IMPROVED)
learning_rate: 0.01             # Learning rate (works well with Adam)
batch_size: 8                   # Reduced from 16 to 8 for small dataset
local_epochs: 5                 # Increased from 3 to 5 for better local learning
optimizer_type: "adam"          # NEW: Use Adam instead of SGD (better convergence)

# Model Architecture (IMPROVED)
hidden_dim: 64                  # Increased from 32 to 64 for more capacity
input_dim: 13                   # Number of input features (Heart Disease dataset)
output_dim: 1                   # Binary classification output

# Dataset Configuration
dataset_id: 45                  # UCI Heart Disease dataset ID
random_seed: 42                 # Random seed for reproducibility
test_split: 0.2                 # Fraction of data reserved for testing

# Data Partitioning
iid: true                       # Whether to use IID (true) or non-IID (false) partitioning

# Aggregation Strategy
strategy: "FedAvg"              # Aggregation strategy (FedAvg for Phase 1)
min_fit_clients: 3              # Minimum clients needed for training
min_evaluate_clients: 3         # Minimum clients needed for evaluation
min_available_clients: 3        # Minimum clients that must be available

# Server Configuration
fraction_fit: 0.8               # Increased from 0.6 to 0.8 (4/5 clients)
fraction_evaluate: 0.8          # Increased for more evaluation data

# ──────────────────────────────────────────────────────────────────────────────
# Phase 2: Attack Configuration
# Set enabled: false (default) to run the clean Phase 1 baseline unchanged.
# Switch enabled: true and select an attack_type to inject malicious clients.
# ──────────────────────────────────────────────────────────────────────────────
attack:
  enabled: false                 # Master switch — false = Phase 1 behaviour

  # Which attack to inject: label_flip | sign_flip | scaling | backdoor
  attack_type: "sign_flip"

  # Number of malicious clients (ignored if malicious_client_ids is non-empty)
  num_malicious_clients: 2

  # Explicit list of client IDs to mark malicious ([] = auto-pick first N)
  malicious_client_ids: [1, 2]

  # ── Label-flip params (attack_type: label_flip) ──────────────────────────
  source_label: 0                # Flip labels FROM this class …
  target_label: 1                # … TO this class

  # ── Scaling-attack params (attack_type: scaling) ─────────────────────────
  scale_factor: 50.0             # Multiply update delta by this factor

  # ── Backdoor params (attack_type: backdoor) ──────────────────────────────
  trigger_feature_indices: [0, 1]   # Feature column indices overwritten
  trigger_value: 1.0                # Value stamped onto trigger features
  poison_fraction: 0.3              # Fraction of local data to poison
  backdoor_target_label: 1          # Label forced onto poisoned samples

# ──────────────────────────────────────────────────────────────────────────────
# Phase 3: Self-Healing Configuration
# Set enabled: true to activate self-healing layer (backward compatible)
# When disabled, system behaves exactly as Phase 1/2
# ──────────────────────────────────────────────────────────────────────────────
self_healing:
  enabled: false                 # Master switch — false = Phase 1/2 behaviour

  # Health monitoring thresholds
  accuracy_drop_threshold: 0.15  # Trigger if accuracy drops by this amount
  loss_spike_threshold: 0.3      # Trigger if loss spikes by this fraction
  dps_threshold: 0.55            # IMPROVED: Lowered from 2.0 to 0.55 for better label-flip detection
  suspicious_fraction_threshold: 0.3  # Fraction of suspicious clients to trigger
  model_drift_threshold: 5.0     # L2 distance threshold for model drift
  baseline_window: 3             # Rolling window for baseline calculation

  # Recovery parameters
  recovery_rounds: 3             # Number of rounds to retrain during recovery
  quarantine_window: 5           # Rounds to keep clients quarantined
  suspicious_weight: 0.1         # Weight multiplier for quarantined clients (0.0-1.0)
  max_recovery_attempts: 3       # Max recovery attempts before giving up

  # Checkpoint management
  max_checkpoints: 3             # Number of checkpoints to retain
